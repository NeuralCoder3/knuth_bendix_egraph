[package]
name = "kbo_rust"
version = "0.1.0"
edition = "2021"
default-run = "main"


[dependencies]
bimap = "0.6.3"
clap = { version = "4.0", features = ["derive"] }
either = "1.15.0"
memoize = "0.5.1"
once_cell = "1.21.3"
symbol_table = {version = "0.4.0", features = ["global"]}

[[bin]]
name = "main"
path = "src/main.rs"
