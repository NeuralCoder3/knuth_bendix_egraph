[package]
name = "kbo_rust"
version = "0.1.0"
edition = "2021"
default-run = "main"


[dependencies]
bimap = "0.6.3"
clap = { version = "4.0", features = ["derive"] }
either = "1.15.0"
memoize = "0.5.1"
once_cell = "1.21.3"
symbol_table = {version = "0.4.0", features = ["global"]}
parking_lot = "0.12"
hashbrown = "0.16"
ahash = "0.8"

[[bin]]
name = "main"
path = "src/main.rs"


[profile.release]
debug = "line-tables-only"
